<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SHA-256 密码哈希生成器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    max-width:560px; margin:48px auto; padding:0 20px; color:#18181b; line-height:1.6;}
  h1{font-size:20px;}
  input{width:100%; height:44px; padding:0 12px; font-size:16px; box-sizing:border-box;
    border:1px solid #ddd; border-radius:10px;}
  button{margin-top:12px; height:44px; padding:0 20px; font-size:15px; border:none;
    border-radius:10px; background:#2563eb; color:#fff; cursor:pointer;}
  pre{background:#f4f4f5; padding:14px; border-radius:10px; word-break:break-all;
    font-size:13px; white-space:pre-wrap;}
  .hint{color:#6b7280; font-size:13px;}
</style>
</head>
<body>
<h1>SHA-256 密码哈希生成器</h1>
<p class="hint">在下方输入你想用的密码，点生成，把结果粘贴到 index.html 的 CONFIG.PASSWORD_HASH 里。</p>
<input id="pwd" type="text" placeholder="输入密码" autocomplete="off">
<button id="btn">生成哈希</button>
<pre id="out">等待生成…</pre>
<script>
document.getElementById("btn").onclick = async () => {
  const p = document.getElementById("pwd").value;
  if (!p) { document.getElementById("out").textContent = "请输入密码"; return; }
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(p));
  const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  document.getElementById("out").textContent = hex;
};
</script>
</body>
</html>
