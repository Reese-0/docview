<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>私密知识库</title>
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #18181b;
            --muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
            --tagbg: #f1f5f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f10;
                --card: #1a1a1c;
                --text: #f4f4f5;
                --muted: #9ca3af;
                --accent: #60a5fa;
                --border: #2a2a2e;
                --tagbg: #26262a;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- 密码门 ---------- */
        #gate {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 100;
            padding: 24px;
        }

        #gate.hidden {
            display: none;
        }

        .gate-box {
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .gate-box .lock {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .gate-box h1 {
            font-size: 20px;
            margin: 0 0 6px;
            font-weight: 600;
        }

        .gate-box p {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 20px;
        }

        .gate-box input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }

        .gate-box input:focus {
            border-color: var(--accent);
        }

        .gate-box button {
            width: 100%;
            height: 48px;
            margin-top: 12px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: opacity .15s;
        }

        .gate-box button:active {
            opacity: .85;
        }

        .gate-box .err {
            color: #ef4444;
            font-size: 13px;
            height: 18px;
            margin-top: 10px;
        }

        /* ---------- 主体 ---------- */
        #app {
            display: none;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        #app.show {
            display: block;
        }

        header.top {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            padding: 14px 0 10px;
            border-bottom: 1px solid var(--border);
            margin: 0 -16px 16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .top-row h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
            letter-spacing: .2px;
        }

        .top-row .logout {
            font-size: 13px;
            color: var(--muted);
            background: none;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .top-row .logout:active {
            background: var(--tagbg);
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--muted);
            pointer-events: none;
        }

        #search {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 36px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            outline: none;
        }

        #search:focus {
            border-color: var(--accent);
        }

        .meta-line {
            font-size: 13px;
            color: var(--muted);
            margin: 14px 2px 10px;
        }

        .card {
            display: block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            transition: transform .08s, border-color .15s;
        }

        .card:active {
            transform: scale(.985);
            border-color: var(--accent);
        }

        .card h2 {
            font-size: 16px;
            margin: 0 0 6px;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
        }

        .card .date {
            font-size: 12.5px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .card .desc {
            font-size: 14px;
            color: var(--muted);
            margin: 6px 0 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tag {
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--tagbg);
            color: var(--muted);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 0;
            font-size: 14px;
        }

        @media (min-width:600px) {
            header.top {
                margin: 0 0 16px;
                border-radius: 0;
            }

            .card:hover {
                border-color: var(--accent);
            }
        }
    </style>
</head>

<body>

    <!-- 密码门 -->
    <div id="gate">
        <div class="gate-box">
            <div class="lock">🔒</div>
            <h1>私密知识库</h1>
            <p>请输入访问密码</p>
            <input id="pwd" type="password" autocomplete="current-password" inputmode="text" placeholder="密码" autofocus>
            <button id="enterBtn">进 入</button>
            <div class="err" id="err"></div>
        </div>
    </div>

    <!-- 主体 -->
    <div id="app">
        <header class="top">
            <div class="top-row">
                <h1 id="siteTitle">我的知识库</h1>
                <button class="logout" id="logoutBtn">退出</button>
            </div>
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input id="search" type="search" placeholder="搜索标题、标签、描述…" autocomplete="off" autocorrect="off"
                    autocapitalize="off" spellcheck="false">
            </div>
        </header>
        <div class="meta-line" id="metaLine"></div>
        <main id="list"></main>
    </div>

    <script>
        /* ============================================================
           配置区 —— 只需要改这里
           ============================================================ */
        const CONFIG = {
            // 把下面这串替换成你自己密码的 SHA-256 哈希（见 README / scripts/hash.html）
            PASSWORD_HASH: "REPLACE_WITH_YOUR_SHA256_HASH",
            // 站点标题
            SITE_TITLE: "我的知识库",
            // 登录状态在 localStorage 里的 key（改名会强制所有设备重新登录）
            STORAGE_KEY: "kb_auth_v1",
            // 目录数据地址
            CATALOG_URL: "./catalog.json",
        };
        /* ============================================================ */

        const $ = (id) => document.getElementById(id);
        const gate = $("gate"), app = $("app");

        document.title = CONFIG.SITE_TITLE;
        $("siteTitle").textContent = CONFIG.SITE_TITLE;

        // ---- 工具函数 ----
        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]
            ));
        }

        // ---- 登录逻辑 ----
        async function tryLogin() {
            const pwd = $("pwd").value;
            if (!pwd) {$("err").textContent = "请输入密码"; return;}
            if (CONFIG.PASSWORD_HASH === "REPLACE_WITH_YOUR_SHA256_HASH") {
                $("err").textContent = "尚未配置密码，请先替换 PASSWORD_HASH";
                return;
            }
            const hash = await sha256Hex(pwd);
            if (hash === CONFIG.PASSWORD_HASH) {
                localStorage.setItem(CONFIG.STORAGE_KEY, hash);
                enterApp();
            } else {
                $("err").textContent = "密码错误";
                $("pwd").value = "";
                $("pwd").focus();
            }
        }

        async function enterApp() {
            gate.classList.add("hidden");
            app.classList.add("show");
            await loadCatalog();
        }

        $("enterBtn").addEventListener("click", tryLogin);
        $("pwd").addEventListener("keydown", e => {if (e.key === "Enter") tryLogin();});
        $("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem(CONFIG.STORAGE_KEY);
            location.reload();
        });

        // 自动登录
        (function autoLogin() {
            const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
            if (saved && saved === CONFIG.PASSWORD_HASH) {
                enterApp();
            } else {
                setTimeout(() => $("pwd").focus(), 50);
            }
        })();

        // ---- 目录加载 & 渲染 ----
        let ALL_POSTS = [];

        async function loadCatalog() {
            const list = $("list");
            try {
                const res = await fetch(CONFIG.CATALOG_URL + "?v=" + Date.now(), {cache: "no-store"});
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                ALL_POSTS = Array.isArray(data.posts) ? data.posts : [];
                renderList(ALL_POSTS);
            } catch (e) {
                list.innerHTML = '<p class="empty">目录加载失败：' + escapeHtml(e.message) + '</p>';
            }
        }

        function renderList(posts) {
            const list = $("list");
            const meta = $("metaLine");
            if (posts.length === 0) {
                list.innerHTML = '<p class="empty">没有匹配的结果</p>';
                meta.textContent = "";
                return;
            }
            meta.textContent = `共 ${posts.length} 篇`;
            const frag = document.createDocumentFragment();
            for (const p of posts) {
                const a = document.createElement("a");
                a.className = "card";
                a.href = p.url;
                const tags = (p.tags || []).map(t =>
                    `<span class="tag">${escapeHtml(t)}</span>`).join("");
                a.innerHTML =
                    `<h2>${escapeHtml(p.title || "(无标题)")}</h2>` +
                    (p.date ? `<div class="date">${escapeHtml(p.date)}</div>` : "") +
                    (p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : "") +
                    (tags ? `<div class="tags">${tags}</div>` : "");
                frag.appendChild(a);
            }
            list.innerHTML = "";
            list.appendChild(frag);
        }

        // ---- 搜索 ----
        $("search").addEventListener("input", (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {renderList(ALL_POSTS); return;}
            const filtered = ALL_POSTS.filter(p => {
                const hay = [
                    p.title || "", p.description || "",
                    ...(p.tags || [])
                ].join("\n").toLowerCase();
                return hay.includes(q);
            });
            renderList(filtered);
        });
    </script>
</body>

</html>
