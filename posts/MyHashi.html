<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="version" content="0.1.1">
<title>橋をかけろ · Hashi 桥梁</title>
<style>
:root {
  --bg: #f3f1ea;
  --bg-glow-1: #e7eef2;
  --bg-glow-2: #f6efe2;
  --surface: #ffffff;
  --surface-soft: #f6f8f9;
  --line: #e4e7e9;
  --line-strong: #d3d9dc;
  --text: #26313a;
  --muted: #77828a;
  --accent: #d99a2b;
  --accent-soft: #fbf0d9;
  --valid: #008c00;
  --invalid: #b3261e;
  --shadow-lg: 0 24px 60px -34px rgba(30, 48, 58, .55);
  --shadow-sm: 0 2px 6px -2px rgba(30, 48, 58, .25);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --board-bg: #f4f7f8;
  --board-dot: #ccd8dd;
  --board-grid: #dae4e8;
  --island-fill: #ffffff;
  --island-ring: #98a2a9;
  --island-text: #3d4750;
  --bridge: #6d767c;
}

[data-theme="dark"] {
  --bg: #12171a;
  --bg-glow-1: #172226;
  --bg-glow-2: #1a1712;
  --surface: #1b2226;
  --surface-soft: #212a2f;
  --line: #2c353a;
  --line-strong: #3a444a;
  --text: #e8edef;
  --muted: #94a0a7;
  --accent: #edb44e;
  --accent-soft: #3a2f1b;
  --valid: #3ec25f;
  --invalid: #ff6f61;
  --shadow-lg: 0 24px 60px -30px rgba(0, 0, 0, .8);
  --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, .6);
  --board-bg: #1e262a;
  --board-dot: #3a474e;
  --board-grid: #333f45;
  --island-fill: #263136;
  --island-ring: #8b979e;
  --island-text: #e6ecee;
  --bridge: #9aa6ac;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(1100px 620px at 12% -10%, var(--bg-glow-1), transparent 62%),
    radial-gradient(900px 520px at 96% 108%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  transition: background-color .3s ease, color .3s ease;
}

.app {
  height: 100vh;
  height: 100dvh;
  max-width: 1080px;
  margin: 0 auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }

.brand h1 {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", Georgia, serif;
  font-size: 1.26rem;
  font-weight: 600;
  letter-spacing: .12em;
  line-height: 1.1;
}

.brand p {
  margin: 0;
  font-size: .64rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
}

.level-btn {
  appearance: none;
  font: inherit;
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease, transform .18s ease;
}

.level-btn:hover { border-color: var(--line-strong); }
.level-btn:active { transform: scale(.98); }
.level-btn span { font-size: .82rem; font-weight: 600; letter-spacing: .02em; }
.level-btn small {
  font-size: .68rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.icon-btn {
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  transition: color .18s ease, border-color .18s ease, transform .18s ease;
}

.icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- 状态栏 ---------- */
.hud {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.hud-item {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: .75rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.hud-item b {
  font-weight: 600;
  color: var(--text);
  font-size: .82rem;
  letter-spacing: .02em;
}

.hud-item.status { margin-left: auto; }
.hud-item.status b { font-size: .75rem; }
.hud-item.status.is-almost b { color: var(--accent); }
.hud-item.status.is-won b { color: var(--valid); }

/* ---------- 进度 ---------- */
.progress {
  height: 3px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}

.progress i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: var(--valid);
  transition: width .35s cubic-bezier(.2, .8, .3, 1);
}

/* ---------- 棋盘 ---------- */
.stage {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
}

/* 绝对定位：棋盘尺寸不会反过来影响 stage 的高度，避免量测反馈循环 */
.board-card {
  position: absolute;
  inset: 0;
  margin: auto;
  width: max-content;
  height: max-content;
  padding: 5px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  line-height: 0;
}

canvas {
  display: block;
  border-radius: 14px;
  touch-action: none;
  cursor: pointer;
  background: var(--board-bg);
}

.stage-note {
  background: var(--surface);
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: .82rem;
  color: var(--muted);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(2px);
  transition: opacity .2s ease;
  pointer-events: none;
  opacity: 0;
}

.stage-note.show { opacity: 1; }

/* ---------- 底部工具栏 ---------- */
.toolbar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.tool {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-md);
  padding: 7px 6px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font: inherit;
  font-size: .72rem;
  cursor: pointer;
  transition: transform .16s ease, border-color .16s ease, background .16s ease;
}

.tool svg { width: 19px; height: 19px; opacity: .85; }
.tool:hover { border-color: var(--line-strong); }
.tool:active { transform: translateY(1px) scale(.99); }
.tool:disabled { opacity: .38; cursor: default; }

.tool.primary {
  background: var(--text);
  color: var(--surface);
  border-color: transparent;
}

.tool.primary svg { opacity: 1; }

/* ---------- 提示条 ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 88px;
  transform: translate(-50%, 12px);
  max-width: min(560px, calc(100vw - 40px));
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(28, 34, 38, .94);
  color: #f2f5f6;
  font-size: .8rem;
  line-height: 1.4;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
  z-index: 40;
}

[data-theme="dark"] .toast { background: rgba(238, 242, 244, .94); color: #1a2024; }

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 弹层 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  padding: 22px;
  background: rgba(20, 28, 33, .38);
  backdrop-filter: blur(6px);
  z-index: 60;
}

.overlay.show { display: grid; }

.dialog {
  width: min(420px, 100%);
  max-height: min(88dvh, 760px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 22px;
  padding: 26px 24px 20px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
  animation: pop .28s cubic-bezier(.2, .9, .3, 1.1);
}

@keyframes pop {
  from { opacity: 0; transform: translateY(14px) scale(.97); }
  to { opacity: 1; transform: none; }
}

.dialog .eyebrow {
  margin: 0 0 6px;
  font-size: .68rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
}

.dialog h2 {
  margin: 0 0 6px;
  font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif;
  font-size: 1.6rem;
  font-weight: 600;
  letter-spacing: .04em;
}

.dialog p.lede { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.6; }

.win-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 18px 0 20px;
}

.win-stats div {
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 8px;
  text-align: center;
}

.win-stats span {
  display: block;
  font-size: .66rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.win-stats b { font-size: 1.02rem; font-weight: 600; font-variant-numeric: tabular-nums; }

.record-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .04em;
}

.dialog-actions { display: flex; gap: 8px; }

.btn {
  flex: 1;
  appearance: none;
  font: inherit;
  font-size: .84rem;
  padding: 11px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.btn:hover { background: var(--surface-soft); }
.btn:active { transform: scale(.985); }

.btn.solid {
  background: var(--text);
  color: var(--surface);
  border-color: transparent;
}

.btn.solid:hover { background: color-mix(in srgb, var(--text) 88%, var(--surface)); }

.rules { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }

.rules li {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 10px;
  font-size: .84rem;
  line-height: 1.6;
  color: var(--text);
}

.rules li em {
  font-style: normal;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  font-size: .68rem;
  color: var(--muted);
}

.rules li span { color: var(--muted); }
.rules li b { display: block; font-weight: 600; color: var(--text); margin-bottom: 2px; }

.tips {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  font-size: .76rem;
  line-height: 1.7;
  color: var(--muted);
}

.tips kbd {
  font: inherit;
  font-size: .7rem;
  padding: 1px 5px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface-soft);
  color: var(--text);
}

/* ---------- 设置抽屉 ---------- */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(18, 26, 31, .38);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
  z-index: 70;
}

.drawer-backdrop.show { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(360px, 92vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: -24px 0 60px -40px rgba(20, 34, 42, .8);
  transform: translateX(102%);
  transition: transform .28s cubic-bezier(.22, .8, .3, 1);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto;
  overscroll-behavior: contain;
}

.drawer.open { transform: translateX(0); }

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.drawer-head h2 {
  margin: 0;
  font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif;
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: .08em;
}

.drawer-section { padding: 14px 0; border-bottom: 1px solid var(--line); }
.drawer-section:last-of-type { border-bottom: 0; }

.segmented {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-soft);
}

.seg {
  flex: 1;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: .8rem;
  padding: 7px 8px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .18s ease, color .18s ease;
}

.seg:hover:not(.is-active) { color: var(--text); background: rgba(127, 127, 127, .1); }

.seg.is-active {
  background: var(--text);
  color: var(--surface);
  font-weight: 600;
}

.size-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 8px;
}

.size-field {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: .7rem;
  color: var(--muted);
}

.size-field input {
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface-soft);
  color: var(--text);
  font: inherit;
  font-size: .9rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.size-field input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.size-times { padding-bottom: 9px; color: var(--muted); font-size: .8rem; }

.row-btn.apply { text-align: center; font-weight: 600; }

.size-error {
  margin: 6px 2px 0;
  font-size: .74rem;
  line-height: 1.5;
  color: var(--invalid);
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity .2s ease, max-height .2s ease;
}

.size-error.show { opacity: 1; max-height: 48px; }

.drawer-section h3 {
  margin: 0 0 10px;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.level-list { display: grid; gap: 6px; }

.level-row {
  appearance: none;
  font: inherit;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "name best" "meta best";
  gap: 2px 10px;
  align-items: center;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color .16s ease, background .16s ease;
}

.level-row:hover { background: var(--surface-soft); }

.level-row.is-active {
  border-color: var(--text);
  background: var(--surface-soft);
}

.level-row .name { grid-area: name; font-size: .86rem; font-weight: 600; letter-spacing: .02em; }
.level-row .meta { grid-area: meta; font-size: .7rem; color: var(--muted); }
.level-row .best {
  grid-area: best;
  display: inline-flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 6px;
  min-width: 76px;
  font-size: .8rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  text-align: right;
}

.level-row .best small {
  font-size: .6rem;
  letter-spacing: .1em;
  color: var(--muted);
  opacity: .8;
}

.level-row .best b { font-weight: 600; color: var(--text); }
.level-row .best b.is-empty { color: var(--muted); font-weight: 500; }
.level-row.is-active .best b:not(.is-empty) { color: var(--valid); }
.level-row .warn { color: var(--accent); font-size: .66rem; margin-left: 6px; }

.drawer-hint {
  margin: 8px 2px 0;
  font-size: .72rem;
  line-height: 1.6;
  color: var(--muted);
  min-height: 1em;
}

.switch-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 2px;
  font-size: .86rem;
  cursor: pointer;
}

.switch-row > span { flex: 1; }

.switch-row input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}

.switch {
  width: 40px;
  height: 23px;
  border-radius: 999px;
  background: var(--line-strong);
  position: relative;
  transition: background .2s ease;
  flex: 0 0 auto;
}

.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .2s ease;
}

.switch-row input:checked + .switch { background: var(--valid); }
.switch-row input:checked + .switch::after { transform: translateX(17px); }
.switch-row input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

.row-btn {
  appearance: none;
  font: inherit;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: .86rem;
  cursor: pointer;
  transition: background .16s ease;
}

.row-btn:hover { background: var(--surface-soft); }
.row-btn.danger { color: var(--invalid); }

.drawer-foot .version {
  display: block;
  margin-top: 6px;
  font-size: .64rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: .7;
}

.drawer-foot {
  margin: auto 0 0;
  padding-top: 14px;
  font-size: .7rem;
  line-height: 1.7;
  color: var(--muted);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- 移动端 ---------- */
@media (max-width: 620px) {
  .app { padding: 6px 6px 6px; gap: 5px; }
  .brand h1 { font-size: 1.05rem; }
  .brand p { display: none; }
  .level-btn { padding: 6px 11px; }
  .level-btn span { font-size: .76rem; }
  .hud-item { padding: 3px 8px; font-size: .7rem; }
  .hud-item b { font-size: .78rem; }
  .tool span { font-size: .66rem; }
  .tool { padding: 6px 4px 5px; }
  .toolbar { gap: 5px; }
  .board-card { padding: 4px; }
  .toast { bottom: 76px; }
}

/* 横屏手机：棋盘在左，信息与操作竖排在右 */
@media (max-height: 560px) and (min-width: 640px) {
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas:
      "top top"
      "hud hud"
      "stage toolbar";
    gap: 6px 12px;
    padding: 8px 14px 10px;
  }
  .topbar { grid-area: top; }
  .hud { grid-area: hud; }
  .progress { display: none; }
  .brand p { display: none; }
  .brand h1 { font-size: 1rem; }
  .stage { grid-area: stage; }
  .toolbar {
    grid-area: toolbar;
    grid-template-columns: 1fr;
    gap: 6px;
    align-content: end;
  }
  .tool {
    flex-direction: row;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 10px;
    font-size: .76rem;
  }
  .tool svg { width: 16px; height: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>橋をかけろ</h1>
      <p>Hashi · Bridges</p>
    </div>
    <button class="level-btn" id="btn-level" type="button" aria-label="切换难度与算法">
      <span id="level-name">Medium</span>
      <small id="level-meta">11×11 · 经典</small>
    </button>
    <button class="icon-btn" id="btn-fullscreen" type="button" aria-label="进入全屏" aria-pressed="false"></button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" aria-haspopup="dialog"></button>
  </header>

  <div class="hud">
    <span class="hud-item">时间 <b id="time">00:00</b></span>
    <span class="hud-item">步数 <b id="moves">0</b></span>
    <span class="hud-item">最佳 <b id="best-time">—</b></span>
    <span class="hud-item status" id="status-item"><b id="status">进行中</b></span>
  </div>

  <div class="progress" aria-hidden="true"><i id="progress"></i></div>

  <main class="stage" id="stage">
    <div class="board-card">
      <canvas id="board" role="img" aria-label="Hashi 棋盘"></canvas>
    </div>
    <div class="stage-note" id="stage-note">正在生成谜题…</div>
  </main>

  <footer class="toolbar">
    <button class="tool" id="btn-undo" type="button" aria-label="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4.5 11.5 9 16"/><path d="M4.5 11.5H14a5.5 5.5 0 0 1 0 11h-1.5"/></svg>
      <span>撤销</span>
    </button>
    <button class="tool" id="btn-redo" type="button" aria-label="重做">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 4.5 4.5L15 16"/><path d="M19.5 11.5H10a5.5 5.5 0 0 0 0 11h1.5"/></svg>
      <span>重做</span>
    </button>
    <button class="tool" id="btn-hint" type="button" aria-label="提示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h6"/><path d="M10 20h4"/><path d="M12 3a6 6 0 0 1 3.5 10.9c-.6.5-1 1.2-1 2.1h-5c0-.9-.4-1.6-1-2.1A6 6 0 0 1 12 3Z"/></svg>
      <span>提示</span>
    </button>
    <button class="tool" id="btn-restart" type="button" aria-label="重开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
      <span>重开</span>
    </button>

<script>
/* Hashi 引擎：谜题生成 + 求解器 + 局面判定
 * 生成范式：先构造合法解（生成树 + 冗余边 + 双桥）→ 赋数字 → 移除桥 → 求解器验证唯一解
 * 参考公开实现思路：erthium/hashiwokakero（构造-验证 + 规则优先搜索）
 */
(function (global) {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  /* ---------- 1. 岛屿布点 ---------- */
  // 自由生长布点：首岛随机落在棋盘任意格，之后每次挑一座已有岛，沿它的行或列
  // 在 2–6 格外放新岛（路径无岛/桥、落点四邻无岛）。每次生长都自带一条候选边，
  // 候选图天然连通；生长路径标记为“桥体”，避免后续生长与之交叉。
  // 不对边界、行列覆盖做任何强制，位置完全由随机生长决定。
  function placeIslands(rows, cols, count, rng) {
    const total = rows * cols;
    if (count > total) count = total;

    const occ = new Uint8Array(total); // 0 空 / 1 岛 / 2 桥体
    const islands = [];
    const at = (r, c) => r * cols + c;

    const freeIsland = (r, c) => {
      if (r < 0 || c < 0 || r >= rows || c >= cols) return false;
      if (occ[at(r, c)]) return false;
      if (r > 0 && occ[at(r - 1, c)] === 1) return false;
      if (r < rows - 1 && occ[at(r + 1, c)] === 1) return false;
      if (c > 0 && occ[at(r, c - 1)] === 1) return false;
      if (c < cols - 1 && occ[at(r, c + 1)] === 1) return false;
      return true;
    };
    const put = (r, c) => {
      occ[at(r, c)] = 1;
      islands.push({ id: islands.length, r, c, clue: 0 });
    };
    const grow = (base, dr, dc, maxLen) => {
      for (let len = maxLen; len >= 2; len--) {
        const r = base.r + dr * len, c = base.c + dc * len;
        if (!freeIsland(r, c)) continue;
        let clear = true;
        for (let k = 1; k < len; k++) if (occ[at(base.r + dr * k, base.c + dc * k)]) { clear = false; break; }
        if (!clear) continue;
        for (let k = 1; k < len; k++) occ[at(base.r + dr * k, base.c + dc * k)] = 2;
        put(r, c);
        return true;
      }
      return false;
    };

    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    put(Math.floor(rng() * rows), Math.floor(rng() * cols));

    let guard = 0;
    while (islands.length < count && guard++ < count * 400) {
      const base = islands[Math.floor(rng() * islands.length)];
      const order = shuffle(dirs.slice(), rng);
      for (const [dr, dc] of order) {
        const span = dr ? rows : cols;
        const maxLen = Math.min(6, span - 1);
        if (maxLen < 2) continue;
        if (grow(base, dr, dc, maxLen)) break;
      }
    }

    return islands.length === count ? islands : [];
  }

  /* ---------- 2. 候选桥（同行/同列、中间无岛） ---------- */
  function buildEdges(islands, rows, cols) {
    const edges = [];
    const byRow = new Map();
    const byCol = new Map();
    for (const isl of islands) {
      if (!byRow.has(isl.r)) byRow.set(isl.r, []);
      byRow.get(isl.r).push(isl);
      if (!byCol.has(isl.c)) byCol.set(isl.c, []);
      byCol.get(isl.c).push(isl);
    }

    const pushPair = (a, b, horizontal) => {
      const cells = [];
      if (horizontal) {
        const lo = Math.min(a.c, b.c), hi = Math.max(a.c, b.c);
        for (let c = lo + 1; c < hi; c++) cells.push(a.r * cols + c);
      } else {
        const lo = Math.min(a.r, b.r), hi = Math.max(a.r, b.r);
        for (let r = lo + 1; r < hi; r++) cells.push(r * cols + a.c);
      }
      edges.push({ a: Math.min(a.id, b.id), b: Math.max(a.id, b.id), cells, cross: [], horizontal });
    };

    for (const list of byRow.values()) {
      list.sort((x, y) => x.c - y.c);
      for (let i = 0; i + 1 < list.length; i++) pushPair(list[i], list[i + 1], true);
    }
    for (const list of byCol.values()) {
      list.sort((x, y) => x.r - y.r);
      for (let i = 0; i + 1 < list.length; i++) pushPair(list[i], list[i + 1], false);
    }

    // 交叉冲突：水平桥与垂直桥共用空格即相交
    const cellOwner = new Map();
    edges.forEach((e, idx) => {
      if (!e.horizontal) return;
      for (const cell of e.cells) {
        if (!cellOwner.has(cell)) cellOwner.set(cell, []);
        cellOwner.get(cell).push(idx);
      }
    });
    edges.forEach((e, idx) => {
      if (e.horizontal) return;
      for (const cell of e.cells) {
        const owners = cellOwner.get(cell);
        if (!owners) continue;
        for (const other of owners) {
          if (!e.cross.includes(other)) e.cross.push(other);
          if (!edges[other].cross.includes(idx)) edges[other].cross.push(idx);
        }
      }
    });

    return edges;
  }

  /* ---------- 3. 构造一个合法解 ---------- */
  function buildSolution(islands, edges, rng, opts) {
    const n = islands.length;
    const m = edges.length;
    const val = new Uint8Array(m);      // 0 / 1 / 2
    const deg = new Uint8Array(n);
    const picked = new Uint8Array(m);

    const order = [];
    for (let i = 0; i < m; i++) order.push(i);
    shuffle(order, rng);

    const parent = new Int32Array(n);
    for (let i = 0; i < n; i++) parent[i] = i;
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };

    const crossesPicked = (idx) => {
      for (const c of edges[idx].cross) if (picked[c]) return true;
      return false;
    };

    let treeCount = 0;
    for (const idx of order) {
      if (treeCount === n - 1) break;
      const e = edges[idx];
      if (find(e.a) === find(e.b)) continue;
      if (crossesPicked(idx)) continue;
      const ra = find(e.a), rb = find(e.b);
      parent[ra] = rb;
      picked[idx] = 1; val[idx] = 1; deg[e.a]++; deg[e.b]++;
      treeCount++;
    }
    if (treeCount !== n - 1) return null;

    // 冗余边：增加环与分支，提升题面约束
    const extraRate = opts.extraRate;
    for (const idx of order) {
      if (picked[idx]) continue;
      if (rng() > extraRate) continue;
      const e = edges[idx];
      if (crossesPicked(idx)) continue;
      if (deg[e.a] >= opts.maxDeg || deg[e.b] >= opts.maxDeg) continue;
      picked[idx] = 1; val[idx] = 1; deg[e.a]++; deg[e.b]++;
    }

    // 双桥
    const pairs = [];
    for (let i = 0; i < m; i++) if (picked[i]) pairs.push(i);
    shuffle(pairs, rng);
    for (const idx of pairs) {
      if (rng() > opts.doubleRate) continue;
      const e = edges[idx];
      if (deg[e.a] + 1 > 8 || deg[e.b] + 1 > 8) continue;
      val[idx] = 2; deg[e.a]++; deg[e.b]++;
    }

    for (let i = 0; i < n; i++) {
      if (deg[i] < 1 || deg[i] > 8) return null;
      islands[i].clue = deg[i];
    }

    return { val, islands };
  }

  /* ---------- 4. 求解器（规则传播 + 回溯，计数解） ---------- */
  function makeSolver(puzzle) {
    const islands = puzzle.islands;
    const edges = puzzle.edges;
    const n = islands.length, m = edges.length;
    const clue = new Int32Array(n);
    for (let i = 0; i < n; i++) clue[i] = islands[i].clue;

    const inc = [];
    for (let i = 0; i < n; i++) inc.push([]);
    for (let i = 0; i < m; i++) { inc[edges[i].a].push(i); inc[edges[i].b].push(i); }

    const state = new Int8Array(m).fill(-1);
    const trail = [];
    let branches = 0;
    let solutions = 0;
    let propRounds = 0;
    let first = null;
    const all = [];
    let limit = 2;

    function setEdge(idx, v) {
      const cur = state[idx];
      if (cur === v) return true;
      if (cur !== -1) return false;
      state[idx] = v;
      trail.push(idx);
      if (v > 0) {
        const cross = edges[idx].cross;
        for (let k = 0; k < cross.length; k++) {
          if (!setEdge(cross[k], 0)) return false;
        }
      }
      return true;
    }

    function truncate(len) {
      while (trail.length > len) {
        state[trail.pop()] = -1;
      }
    }

    function islandStats(i, out) {
      let assigned = 0, open = 0;
      const list = inc[i];
      for (let k = 0; k < list.length; k++) {
        const v = state[list[k]];
        if (v < 0) open++; else assigned += v;
      }
      out.assigned = assigned; out.open = open;
    }

    const stats = { assigned: 0, open: 0 };

    function propagate() {
      let changed = true;
      while (changed) {
        changed = false;
        propRounds++;
        for (let i = 0; i < n; i++) {
          islandStats(i, stats);
          const need = clue[i] - stats.assigned;
          if (need < 0) return false;
          const cap = 2 * stats.open;
          if (need > cap) return false;
          if (stats.open === 0) continue;
          if (need === 0) {
            for (const ei of inc[i]) if (state[ei] < 0) { if (!setEdge(ei, 0)) return false; changed = true; }
          } else if (need === cap) {
            for (const ei of inc[i]) if (state[ei] < 0) { if (!setEdge(ei, 2)) return false; changed = true; }
          } else if (stats.open === 1) {
            for (const ei of inc[i]) if (state[ei] < 0) { if (!setEdge(ei, need)) return false; changed = true; }
          }
        }
      }
      return true;
    }

    // 连通性剪枝：已连成一片的岛若再无可能接出去，则不可能全连通
    function componentsFeasible() {
      const parent = new Int32Array(n);
      for (let i = 0; i < n; i++) parent[i] = i;
      const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
      for (let i = 0; i < m; i++) {
        if (state[i] > 0) {
          const ra = find(edges[i].a), rb = find(edges[i].b);
          if (ra !== rb) parent[ra] = rb;
        }
      }
      const comp = new Map();
      for (let i = 0; i < n; i++) {
        const root = find(i);
        if (!comp.has(root)) comp.set(root, []);
        comp.get(root).push(i);
      }
      if (comp.size === 1) return true;
      for (const members of comp.values()) {
        const inComp = new Set(members);
        let escape = false;
        for (const i of members) {
          for (const ei of inc[i]) {
            if (state[ei] >= 0) continue;
            const e = edges[ei];
            const other = e.a === i ? e.b : e.a;
            if (!inComp.has(other)) { escape = true; break; }
          }
          if (escape) break;
        }
        if (!escape) return false;
      }
      return true;
    }

    function connected() {
      const parent = new Int32Array(n);
      for (let i = 0; i < n; i++) parent[i] = i;
      const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
      for (let i = 0; i < m; i++) {
        if (state[i] > 0) {
          const ra = find(edges[i].a), rb = find(edges[i].b);
          if (ra !== rb) parent[ra] = rb;
        }
      }
      const root = find(0);
      for (let i = 1; i < n; i++) if (find(i) !== root) return false;
      return true;
    }

    function domain(i, exceptIdx, out) {
      islandStats(i, stats);
      const need = clue[i] - stats.assigned;
      const open = stats.open - (state[exceptIdx] < 0 ? 1 : 0);
      out.lo = Math.max(0, need - 2 * open);
      out.hi = Math.min(2, need);
    }

    const da = { lo: 0, hi: 0 }, db = { lo: 0, hi: 0 };

    function search() {
      if (solutions >= limit) return;
      if (!propagate()) return;
      if (!componentsFeasible()) return;

      let best = -1, bestSize = 4, bestLo = 0;
      for (let i = 0; i < m; i++) {
        if (state[i] >= 0) continue;
        const e = edges[i];
        domain(e.a, i, da);
        domain(e.b, i, db);
        const lo = Math.max(da.lo, db.lo);
        const hi = Math.min(da.hi, db.hi);
        if (lo > hi) return;
        const size = hi - lo + 1;
        if (size < bestSize) { bestSize = size; best = i; bestLo = lo; if (size === 1) break; }
      }

      if (best === -1) {
        if (connected()) {
          solutions++;
          all.push(Array.from(state));
          if (solutions === 1) first = state.slice();
        }
        return;
      }

      branches++;
      const values = [];
      for (let v = bestLo; v <= Math.min(2, bestLo + bestSize - 1); v++) values.push(v);
      if (values.length > 1) values.sort((x, y) => Math.abs(x - 1) - Math.abs(y - 1));
      for (const v of values) {
        const mark = trail.length;
        if (setEdge(best, v)) search();
        truncate(mark);
        if (solutions >= limit) return;
      }
    }

    return {
      run(maxSolutions) {
        limit = maxSolutions || 2;
        solutions = 0; branches = 0; first = null; all.length = 0;

        // 逻辑预演：只做约束传播，记录“纯逻辑能推出多少桥、推了几轮”
        const mark = trail.length;
        propRounds = 0;
        const logicOk = propagate();
        let fixed = 0;
        for (let i = 0; i < state.length; i++) if (state[i] >= 0) fixed++;
        const logic = { fixed, total: state.length, rounds: propRounds, ok: logicOk };
        truncate(mark);
        propRounds = 0;

        search();
        return {
          count: solutions,
          branches,
          solution: first ? Array.from(first) : null,
          all,
          logic,
          solvableByLogic: branches === 0 && solutions > 0
        };
      }
    };
  }

  /* ---------- 5. 生成入口 ---------- */
  /* 五档尺寸对齐 APK（竖屏口径，宽×高 = 6×9 / 8×12 / 10×15 / 13×18 / 15×22）。
   * 这里用 rows/cols 表示：rows = 高，cols = 宽。桌面端由 game.js 旋转 90° 使用。 */
  const LEVELS = {
    mini:    { key: 'mini',    label: 'Mini',    rows: 9,  cols: 6,  islands: [9, 13],  targetBranches: 2,  tolerance: 2, extraRate: 0, doubleRate: 0.24, maxDeg: 8 },
    small:   { key: 'small',   label: 'Small',   rows: 12, cols: 8,  islands: [13, 18], targetBranches: 4,  tolerance: 2, extraRate: 0, doubleRate: 0.24, maxDeg: 8 },
    medium:  { key: 'medium',  label: 'Medium',  rows: 15, cols: 10, islands: [18, 25], targetBranches: 7,  tolerance: 3, extraRate: 0, doubleRate: 0.24, maxDeg: 8 },
    large:   { key: 'large',   label: 'Large',   rows: 18, cols: 13, islands: [23, 31], targetBranches: 12, tolerance: 4, extraRate: 0, doubleRate: 0.16, maxDeg: 8 },
    massive: { key: 'massive', label: 'Massive', rows: 22, cols: 15, islands: [30, 40], targetBranches: 18, tolerance: 5, extraRate: 0, doubleRate: 0.16, maxDeg: 8 }
  };

  /** 允许传档位名，或直接传一份配置（自定义尺寸时使用） */
  function resolveConfig(level) {

  const DIRS = [
    { name: 'LEFT', dx: -1, dy: 0, vertical: false },
    { name: 'TOP', dx: 0, dy: -1, vertical: true },
    { name: 'RIGHT', dx: 1, dy: 0, vertical: false },
