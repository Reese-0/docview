  const BESTS_KEY = 'hashi.bests.v1';
  const MIN_CELL = 24;

  /* 两种生成算法。尺寸上限来自实测：
   *   经典：18×18 最坏 50ms；19×19 起唯一解命中率骤降（19×19 最坏 542ms，20×20 727ms）
   *   APK ：20×20 最坏 179ms（22×22 起可到 0.5s），因此上限 20
   */
  const ALGORITHMS = {
    classic: {
      key: 'classic',
      label: '经典',
      min: 5,
      max: 22,
      maxArea: 330,
      hint: '格点构造 + 唯一解计数：题面疏朗、短桥多，稳定可解。'
    },
    apk: {
      key: 'apk',
      label: 'APK 复刻',
      min: 5,
      max: 22,
      maxArea: 400,
      hint: '随机生长 + 规则求解校验：岛屿更密、长桥更多，接近 Android 原版手感。'
    }
  };

  /* 五档尺寸按 APK 的竖屏比例设计（宽×高：6×9 / 8×12 / 10×15 / 13×18 / 15×22）。
   * 移动端直接用竖版；桌面/横屏把棋盘旋转 90°（行列互换）。 */
  function isLandscapeViewport() {
    const rect = els.stage ? els.stage.getBoundingClientRect() : null;
    if (rect && rect.height > 40) return rect.width > rect.height * 1.02;
    return window.innerWidth > window.innerHeight;
  }

  function orientedDims(level) {
    const cfg = Engine.LEVELS[level] || Engine.LEVELS.medium;
    return isLandscapeViewport()
      ? { rows: cfg.cols, cols: cfg.rows }
      : { rows: cfg.rows, cols: cfg.cols };
  }

  const els = {
    app: document.querySelector('.app'),
    stage: document.getElementById('stage'),
    canvas: document.getElementById('board'),
    levelBtn: document.getElementById('btn-level'),
    levelName: document.getElementById('level-name'),
    levelMeta: document.getElementById('level-meta'),
    bestTime: document.getElementById('best-time'),
    time: document.getElementById('time'),
    moves: document.getElementById('moves'),
    status: document.getElementById('status'),
    progress: document.getElementById('progress'),
    statusItem: document.getElementById('status-item'),
    note: document.getElementById('stage-note'),
    toast: document.getElementById('toast'),
    overlay: document.getElementById('overlay'),
    dialog: document.getElementById('dialog'),
    undo: document.getElementById('btn-undo'),
    redo: document.getElementById('btn-redo'),
    hint: document.getElementById('btn-hint'),
    restart: document.getElementById('btn-restart'),
    fresh: document.getElementById('btn-new'),
    settings: document.getElementById('btn-settings'),
    fullscreen: document.getElementById('btn-fullscreen'),
    version: document.getElementById('app-version'),
    drawer: document.getElementById('drawer'),
    drawerClose: document.getElementById('btn-drawer-close'),
    backdrop: document.getElementById('drawer-backdrop'),
    levelList: document.getElementById('level-list'),
    levelHint: document.getElementById('level-hint'),
    algoGroup: document.getElementById('algo-group'),
    algoHint: document.getElementById('algo-hint'),
    sizeCols: document.getElementById('size-cols'),
    sizeRows: document.getElementById('size-rows'),
    applySize: document.getElementById('btn-apply-size'),
    sizeError: document.getElementById('size-error'),
    sizeHint: document.getElementById('size-hint'),
    optSound: document.getElementById('opt-sound'),
    optTheme: document.getElementById('opt-theme'),
    help: document.getElementById('btn-help'),
    clearBests: document.getElementById('btn-clear-bests')
  };

  const ctx = els.canvas.getContext('2d');
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const P = {};

  const S = {
    algorithm: 'classic',
    level: 'medium',
    rows: 11,
    cols: 11,
    seed: 0,
    puzzle: null,
    bridges: null,
    solution: null,
    edgeIndex: new Map(),
    incident: [],
    history: [],
    future: [],
    moves: 0,
    elapsed: 0,
    startedAt: 0,
    running: false,
    won: false,
    selected: -1,
    hint: null,
    shake: null,
    sum: null,
    over: [],
    done: [],
    soundOn: true,
    theme: 'light',
    almostNotified: false,
    lastRecord: false
  };

  const view = { cell: 40, pad: 16, w: 0, h: 0, r: 12, dpr: 1 };

  /* ---------------- 主题与配色 ---------------- */
  function readPalette() {
    const cs = getComputedStyle(document.documentElement);
    const get = n => cs.getPropertyValue(n).trim();
    P.boardBg = get('--board-bg');
    P.dot = get('--board-dot');
    P.grid = get('--board-grid');
    P.fill = get('--island-fill');
    P.ring = get('--island-ring');
    P.text = get('--island-text');
    P.bridge = get('--bridge');
    P.valid = get('--valid');
    P.invalid = get('--invalid');
    P.accent = get('--accent');
    P.surface = get('--surface');
    P.muted = get('--muted');
  }

  function applyTheme(theme) {
    S.theme = theme;
    document.documentElement.dataset.theme = theme;
    readPalette();
    if (els.optTheme) els.optTheme.checked = theme === 'dark';
    renderBackground();
    requestDraw();
  }

  /* ---------------- 图标 ---------------- */
  const icon = {
    expand: () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M15 20h5v-5"/><path d="M9 20H4v-5"/></svg>',
    collapse: () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h5V4"/><path d="M20 9h-5V4"/><path d="M20 15h-5v5"/><path d="M4 15h5v5"/></svg>',
    gear: () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>'
  };

  /* ---------------- 音效 ---------------- */
  let audio = null;
  function play(kind) {
    if (!S.soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const now = audio.currentTime;
      const tones = {
        place: [[520, 0.05]],
        remove: [[300, 0.06]],
        double: [[640, 0.05], [760, 0.05]],
        error: [[180, 0.1]],
        win: [[523, 0.12], [659, 0.12], [784, 0.16], [1046, 0.24]]
      }[kind] || [[440, 0.05]];
      let t = now;
      for (const [freq, dur] of tones) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.09, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur * 0.72;
      }
    } catch (_) { /* 忽略音频错误 */ }
  }

  /* ---------------- 生成与状态 ---------------- */
  function setPuzzle(p, seed) {
    S.puzzle = p;
    S.seed = seed;
    S.rows = p.rows;
    S.cols = p.cols;
    S.bridges = new Uint8Array(p.edges.length);
    S.solution = p.solution;
    S.history = [];
    S.future = [];
    S.moves = 0;
    S.elapsed = 0;
    S.startedAt = 0;
    S.running = false;
    S.won = false;
    S.selected = -1;
    S.hint = null;
    S.shake = null;
    S.almostNotified = false;
    S.lastRecord = false;
    S.edgeIndex = new Map();
    p.edges.forEach((e, i) => S.edgeIndex.set(e.a + '-' + e.b, i));
    S.incident = Array.from({ length: p.islands.length }, () => []);
    p.edges.forEach((e, i) => { S.incident[e.a].push(i); S.incident[e.b].push(i); });
    refresh();
    layout();
    requestDraw();
    updateStatus();
    updateUndoRedo();
    renderTime();
    syncUI();
    els.canvas.setAttribute('aria-label', `Hashi 棋盘，${p.islands.length} 座岛屿，${p.rows} 行 ${p.cols} 列`);
    save();
  }

  /** 统一入口：按算法与尺寸生成，返回 engine.js 结构 */
  function generatePuzzle(algorithm, level, rows, cols, seed) {
    if (algorithm === 'apk' && window.HashiApk) {
      return window.HashiApk.generateApk(rows, cols, seed, { maxGenerations: 40 });
    }
    // 预设也要带上朝向后的行列（旋转 90° 时行列互换）
    const base = level === 'custom' ? Engine.customConfig(rows, cols) : Engine.resolveConfig(level);
    return Engine.generate(Object.assign({}, base, { rows, cols }), seed);
  }

  /** 计算本次要用的 算法/档位/行列 */
  function resolveTarget(o) {
    const algorithm = ALGORITHMS[o.algorithm] ? o.algorithm : S.algorithm;
    const level = o.level || S.level;
    if (level === 'custom') {
      // 自定义尺寸由玩家直接指定，不再自动旋转
      return { algorithm, level, rows: o.rows || S.rows, cols: o.cols || S.cols };
    }
    const dims = orientedDims(level);
    return { algorithm, level, rows: dims.rows, cols: dims.cols };
  }

  function newGame(opts) {
    const o = typeof opts === 'string' ? { level: opts } : (opts || {});
    const target = resolveTarget(o);
    const seed = o.seed === undefined || o.seed === null ? (Math.random() * 1e9) | 0 : o.seed;
    const prev = { algorithm: S.algorithm, level: S.level, rows: S.rows, cols: S.cols };
    // 先生效算法，让设置面板立刻反馈；生成失败再回滚
    S.algorithm = target.algorithm;
    syncUI();
    els.note.textContent = '正在生成谜题…';
    els.note.classList.add('show');
    const t0 = performance.now();
    setTimeout(() => {
      const p = generatePuzzle(target.algorithm, target.level, target.rows, target.cols, seed);
      if (!p) {
        S.algorithm = prev.algorithm;
        syncUI();
        els.note.textContent = '生成失败，请调整尺寸后重试';
        setTimeout(() => els.note.classList.remove('show'), 1600);
        return;
      }
      S.algorithm = target.algorithm;
      S.level = target.level;
      S.rows = target.rows;
      S.cols = target.cols;
      setPuzzle(p, seed);
      els.note.classList.remove('show');
      if (performance.now() - t0 > 400) toast('已生成新谜题');
    }, 20);
  }

  function refresh() {
    const an = Engine.analyze(S.puzzle, S.bridges);
    S.sum = an.sum;
    S.over = an.over;
    S.done = an.done;
    return an;
  }

  /* ---------------- 布局与绘制 ---------------- */
  function layout() {
    if (!S.puzzle) return;
    const rect = els.stage.getBoundingClientRect();
    const maxW = Math.max(200, rect.width - 12);
    const maxH = Math.max(200, rect.height - 12);
    const { rows, cols } = S.puzzle;
    const padFactor = 0.34;
    let cell = Math.floor(Math.min(maxW / (cols + padFactor * 2), maxH / (rows + padFactor * 2)));
    cell = Math.max(16, cell);
    view.cell = cell;
    view.pad = Math.round(cell * padFactor);
    view.w = cols * cell + view.pad * 2;
    view.h = rows * cell + view.pad * 2;
    view.r = Math.max(8, cell * 0.365);
    view.dpr = Math.min(3, window.devicePixelRatio || 1);

    els.canvas.style.width = view.w + 'px';
    els.canvas.style.height = view.h + 'px';
    els.canvas.width = Math.round(view.w * view.dpr);
    els.canvas.height = Math.round(view.h * view.dpr);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    renderBackground();
    requestDraw();
  }

  /** 背景：纸面 + 点阵（离屏缓存，避免每帧重画；虚线引导线在 draw 中单独绘制） */
  function renderBackground() {
    if (!S.puzzle || !view.w) return;
    const { cell, pad, w, h, dpr } = view;
    bgCanvas.width = Math.round(w * dpr);
    bgCanvas.height = Math.round(h * dpr);
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bgCtx.clearRect(0, 0, w, h);

    bgCtx.fillStyle = P.boardBg;
    roundRect(bgCtx, 0.5, 0.5, w - 1, h - 1, 14);
    bgCtx.fill();

    // 点阵：每个格子中心
    bgCtx.fillStyle = P.dot;
    const dotR = Math.max(1, cell * 0.024);
    for (let r = 0; r < S.puzzle.rows; r++) {
      for (let c = 0; c < S.puzzle.cols; c++) {
        bgCtx.beginPath();
        bgCtx.arc(pad + c * cell + cell / 2, pad + r * cell + cell / 2, dotR, 0, Math.PI * 2);
        bgCtx.fill();
      }
    }
  }

  function centerOf(isl) {
    return {
      x: view.pad + isl.c * view.cell + view.cell / 2,
      y: view.pad + isl.r * view.cell + view.cell / 2
    };
  }

  let frame = 0;
  let rafId = 0;
  function requestDraw() {
    if (rafId) return;
    rafId = requestAnimationFrame(t => {
      rafId = 0;
      draw(t);
      if (needsAnimation()) ensureLoop();
    });
  }

  function needsAnimation() {
    return !!(S.selected >= 0 || S.hint || S.won || S.shake || S.dragPreview);
  }

  function loop(t) {
    frame = 0;
    draw(t);
    if (needsAnimation()) frame = requestAnimationFrame(loop);
  }

  function ensureLoop() {
    if (!frame) frame = requestAnimationFrame(loop);
  }

  function draw(t) {
    if (!S.puzzle) return;
    const now = t || performance.now();
    const { cell, pad, w, h } = view;

    ctx.clearRect(0, 0, w, h);
    if (bgCanvas.width) ctx.drawImage(bgCanvas, 0, 0, w, h);

    drawGuides();
    drawBridges(now);
    drawHint(now);
    drawDragPreview();
    drawIslands(now);
  }

  /** 虚线引导线：揭示「同行/同列且中间无岛」的可连方向；选中的岛高亮，其余淡出 */
  function drawGuides() {
    if (S.won) return;                       // 通关后不再显示未完成方向的引导
    const edges = S.puzzle.edges;
    const selected = S.selected;
    const rim = view.r * 0.94;
    ctx.save();
    ctx.lineWidth = 1;
    for (let i = 0; i < edges.length; i++) {
      if (S.bridges[i]) continue;
      const e = edges[i];
      const hot = selected >= 0 && (e.a === selected || e.b === selected);
      const a = centerOf(S.puzzle.islands[e.a]);
      const b = centerOf(S.puzzle.islands[e.b]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      ctx.globalAlpha = hot ? 0.75 : (selected >= 0 ? 0.16 : 0.34);
      ctx.strokeStyle = hot ? P.accent : P.bridge;
      ctx.setLineDash(hot ? [4, 4] : [3, 5]);
      ctx.beginPath();
      ctx.moveTo(a.x + ux * rim, a.y + uy * rim);
      ctx.lineTo(b.x - ux * rim, b.y - uy * rim);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBridges(now) {
    const edges = S.puzzle.edges;
    const overSet = new Set(S.over);
    ctx.lineCap = 'round';

    for (let i = 0; i < edges.length; i++) {
      const v = S.bridges[i];
      if (!v) continue;
      const e = edges[i];
      const a = centerOf(S.puzzle.islands[e.a]);
      const b = centerOf(S.puzzle.islands[e.b]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const r = view.r * 0.94;
      const x1 = a.x + ux * r, y1 = a.y + uy * r;
      const x2 = b.x - ux * r, y2 = b.y - uy * r;

      const bad = overSet.has(e.a) || overSet.has(e.b);
      let color = bad ? P.invalid : P.bridge;
      let alpha = bad ? 0.92 : 0.95;

      if (S.won) {
        color = P.valid;
        alpha = 0.9;
      }

      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;

      if (v === 1) {
        ctx.lineWidth = Math.max(2.4, view.cell * 0.115);
        line(x1, y1, x2, y2);
      } else {
        const off = Math.max(2.2, view.cell * 0.062);
        const px = -uy * off, py = ux * off;
        ctx.lineWidth = Math.max(1.8, view.cell * 0.082);
        line(x1 + px, y1 + py, x2 + px, y2 + py);
        line(x1 - px, y1 - py, x2 - px, y2 - py);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHint(now) {
    if (!S.hint) return;
    if (now > S.hint.until) { S.hint = null; return; }
    const e = S.puzzle.edges[S.hint.edge];
    if (!e) return;
    const a = centerOf(S.puzzle.islands[e.a]);
    const b = centerOf(S.puzzle.islands[e.b]);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const r = view.r * 0.98;

    const pulse = 0.55 + 0.45 * Math.sin(now / 260);
    const color = S.hint.mode === 'remove' ? P.invalid : P.valid;

    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * pulse;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2.5, view.cell * 0.1);
    ctx.setLineDash([Math.max(4, view.cell * 0.18), Math.max(4, view.cell * 0.16)]);
    ctx.lineDashOffset = -now / 45;
    line(a.x + ux * r, a.y + uy * r, b.x - ux * r, b.y - uy * r);
    ctx.restore();

    // 两端脉动环
    for (const p of [a, b]) {
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.3 * pulse;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, view.r + 4 + pulse * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawDragPreview() {
    if (!S.dragPreview) return;
    const { from, to } = S.dragPreview;
    if (from < 0 || to < 0) return;
    const a = centerOf(S.puzzle.islands[from]);
    const b = centerOf(S.puzzle.islands[to]);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = P.accent;
    ctx.lineWidth = Math.max(2.4, view.cell * 0.1);
    ctx.setLineDash([6, 6]);
    line(a.x, a.y, b.x, b.y);
    ctx.restore();
  }

  function drawIslands(now) {
    const islands = S.puzzle.islands;
    const doneSet = new Set(S.done);
    const overSet = new Set(S.over);

    for (const isl of islands) {
      const { x, y } = centerOf(isl);
      let cx = x, cy = y;
      if (S.shake && S.shake.id === isl.id && now - S.shake.at < 380) {
        const k = 1 - (now - S.shake.at) / 380;
        cx += Math.sin((now - S.shake.at) / 22) * 3.4 * k;
      }

      const over = overSet.has(isl.id);
      const done = doneSet.has(isl.id);
      const selected = S.selected === isl.id;

      let ring = P.ring;
      let text = P.text;
      let fill = P.fill;
      if (over) { ring = P.invalid; text = P.invalid; }
      else if (done) { ring = P.valid; text = P.valid; }
      if (selected) ring = P.accent;

      const scale = selected ? 1 + 0.035 * Math.sin(now / 320) : 1;
      const r = view.r * scale;

      if (selected) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = P.accent;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.shadowColor = S.theme === 'dark' ? 'rgba(0,0,0,.55)' : 'rgba(30,48,58,.16)';
      ctx.shadowBlur = Math.max(3, view.cell * 0.12);
      ctx.shadowOffsetY = Math.max(1, view.cell * 0.03);
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(1.8, view.cell * 0.068);
      ctx.strokeStyle = ring;
      ctx.stroke();

      if (done) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.strokeStyle = ring;
        ctx.lineWidth = Math.max(1, view.cell * 0.028);
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.62, cy - r * 0.62);
        ctx.lineTo(cx + r * 0.62, cy + r * 0.62);
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = text;
      const fs = Math.max(9, r * 1.02);
      ctx.font = `600 ${fs}px "Inter", "SF Pro Text", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(isl.clue), cx, cy + fs * 0.04);
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  /* ---------------- 交互 ---------------- */
  function toBoard(ev) {
    const rect = els.canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }

  function islandAt(x, y) {
    if (!S.puzzle) return -1;
    const limit = Math.max(view.r * 1.5, view.cell * 0.46);
    let best = -1, bestD = Infinity;
    for (const isl of S.puzzle.islands) {
      const c = centerOf(isl);
      const d = Math.hypot(c.x - x, c.y - y);
      if (d < limit && d < bestD) { bestD = d; best = isl.id; }
    }
    return best;
  }

  /** 命中测试：点是否落在某座已建成的桥上（用于「点桥即拆」） */
  function bridgeAt(x, y) {
    if (!S.puzzle) return -1;
    const tol = Math.max(view.r * 0.9, view.cell * 0.28);
    let best = -1, bestD = Infinity;
    for (let i = 0; i < S.puzzle.edges.length; i++) {
      if (!S.bridges[i]) continue;
      const e = S.puzzle.edges[i];
      const a = centerOf(S.puzzle.islands[e.a]);
      const b = centerOf(S.puzzle.islands[e.b]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / len2));
      const d = Math.hypot(x - (a.x + dx * t), y - (a.y + dy * t));
      if (d <= tol && d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function edgeBetween(a, b) {
    const key = Math.min(a, b) + '-' + Math.max(a, b);
    const idx = S.edgeIndex.get(key);
    return idx === undefined ? -1 : idx;
  }

  function targetForDrag(fromId, x, y) {
    let best = -1, bestScore = Infinity;
    for (const ei of S.incident[fromId]) {
      const e = S.puzzle.edges[ei];
      const otherId = e.a === fromId ? e.b : e.a;
      const a = centerOf(S.puzzle.islands[fromId]);
      const b = centerOf(S.puzzle.islands[otherId]);
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy || 1;
      const t = ((x - a.x) * dx + (y - a.y) * dy) / len2;
      if (t < 0.25 || t > 1.25) continue;
      const px = a.x + dx * Math.min(1, t), py = a.y + dy * Math.min(1, t);
      const dist = Math.hypot(x - px, y - py);
      if (dist > view.cell * 0.75) continue;
      const score = dist + (1 - Math.min(1, t)) * view.cell;
      if (score < bestScore) { bestScore = score; best = otherId; }
    }
    return best;
  }

  let drag = null;

  els.canvas.addEventListener('pointerdown', ev => {
    if (!S.puzzle || S.won) return;
    if (drag) return; // 忽略多指同时按下，避免状态互相覆盖
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    const p = toBoard(ev);
    const id = islandAt(p.x, p.y);
    if (id < 0) {
      const bi = bridgeAt(p.x, p.y);
      S.selected = -1;
      if (bi >= 0) {
        // APK: "To delete a bridge you swipe again or simply click on it."
        setBridge(bi, 0, true);
        return;
      }
      requestDraw();
      return;
    }
    drag = { id, x: p.x, y: p.y, moved: false, target: -1, pointerId: ev.pointerId };
    try { els.canvas.setPointerCapture(ev.pointerId); } catch (_) {}
    S.hint = null;
  });

  els.canvas.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const p = toBoard(ev);
    if (!drag.moved && Math.hypot(p.x - drag.x, p.y - drag.y) > Math.max(8, view.cell * 0.24)) {
      drag.moved = true;
    }
    if (drag.moved) {
      const t = targetForDrag(drag.id, p.x, p.y);
      S.dragPreview = t >= 0 ? { from: drag.id, to: t } : null;
      drag.target = t;
      requestDraw();
    }
  });

  function endDrag(ev, cancelled) {
    if (!drag || (ev && ev.pointerId !== drag.pointerId)) return;
    const { id, moved, target } = drag;
    drag = null;
    S.dragPreview = null;
    try { els.canvas.releasePointerCapture(ev.pointerId); } catch (_) {}

    if (!cancelled) {
      if (moved && target >= 0 && target !== id) {
        const ei = edgeBetween(id, target);
        if (ei >= 0) cycleEdge(ei);
        else S.selected = id;
      } else if (!moved) {
        tapIsland(id);
      }
    }
    requestDraw();
  }

  els.canvas.addEventListener('pointerup', ev => endDrag(ev, false));
  els.canvas.addEventListener('pointercancel', ev => endDrag(ev, true));

  function tapIsland(id) {
    if (S.selected === id) { S.selected = -1; return; }
    if (S.selected >= 0) {
      const ei = edgeBetween(S.selected, id);
      if (ei >= 0) { cycleEdge(ei); return; }
    }
    S.selected = id;
  }

  function cycleEdge(ei) {
    const cur = S.bridges[ei];
    const next = cur === 0 ? 1 : cur === 1 ? 2 : 0;
    setBridge(ei, next, true);
  }

  function setBridge(ei, value, record) {
    const prev = S.bridges[ei];
    if (prev === value) return;
    if (value > 0) {
      const cross = S.puzzle.edges[ei].cross || [];
      for (const ci of cross) {
        if (S.bridges[ci] > 0) {
          toast('桥不能交叉');
          play('error');
          return;
        }
      }
    }
    S.bridges[ei] = value;
    if (record) {
      S.history.push({ ei, prev, next: value });
      S.future.length = 0;
      S.hint = null;
      S.moves++;
      if (!S.running && !S.won) startTimer();
      if (value === 2) play('double');
      else if (value === 0) play('remove');
      else play('place');
    }
    const an = refresh();
    if (an.over.length && prev <= S.solution[ei] && value > S.solution[ei]) {
      S.shake = { id: an.over[an.over.length - 1], at: performance.now() };
      play('error');
      toast('桥太多了，超出岛上的数字');
    }
    updateStatus();
    updateUndoRedo();
    save();
    requestDraw();

    if (an.solved && !S.won) finish();
    else if (an.almost && !S.almostNotified) {
      S.almostNotified = true;
      toast('数字都对上了，但还有岛屿没连成一片');
    } else if (!an.almost) {
      S.almostNotified = false;
    }
  }

  function undo() {
    if (!S.history.length || S.won) return;
    const a = S.history.pop();
    S.bridges[a.ei] = a.prev;
    S.future.push(a);
    S.moves = Math.max(0, S.moves - 1);
    refresh();
    updateStatus();
    updateUndoRedo();
    save();
    requestDraw();
    play('remove');
  }

  function redo() {
    if (!S.future.length || S.won) return;
    const a = S.future.pop();
    S.bridges[a.ei] = a.next;
    S.history.push(a);
    S.moves++;
    refresh();
    updateStatus();
    updateUndoRedo();
    save();
    requestDraw();
    play('place');
  }

  function restart() {
    if (!S.puzzle) return;
    S.bridges.fill(0);
    S.history = [];
    S.future = [];
    S.moves = 0;
    S.elapsed = 0;
    S.running = false;
    S.startedAt = 0;
    S.won = false;
    S.selected = -1;
    S.hint = null;
    S.almostNotified = false;
    refresh();
    renderTime();
    updateStatus();
    updateUndoRedo();
    save();
    requestDraw();
    toast('已清空棋盘');
  }

  /* ---------------- 提示 ---------------- */
  function doHint() {
    if (!S.puzzle || S.won) return;
    const sol = S.solution;
    let wrong = -1, missing = -1;
    for (let i = 0; i < sol.length; i++) {
      if (S.bridges[i] > sol[i]) { wrong = i; break; }
    }
    if (wrong < 0) {
      for (let i = 0; i < sol.length; i++) {
        if (S.bridges[i] < sol[i]) {
          if (missing < 0 || (S.bridges[i] === 0 && S.bridges[missing] > 0)) missing = i;
        }
      }
    }
    const target = wrong >= 0 ? wrong : missing;
    if (target < 0) {
      toast('棋盘已经完成');
      return;
    }
    const now = performance.now();
    if (S.hint && S.hint.edge === target && now < S.hint.until) {
      setBridge(target, sol[target], true);
      S.hint = null;
      return;
    }
    S.hint = { edge: target, until: now + 9000, mode: wrong >= 0 ? 'remove' : 'add' };
    S.selected = -1;
    toast(wrong >= 0 ? '这里多了一座桥 · 再点一次「提示」即可移除' : '这里还差桥 · 再点一次「提示」即可落桥');
    requestDraw();
  }

  /* ---------------- 最佳成绩 ---------------- */
  let bests = {};

  function loadBests() {
    try {
      const raw = JSON.parse(localStorage.getItem(BESTS_KEY) || '{}');
      bests = raw && typeof raw === 'object' ? raw : {};
    } catch (_) { bests = {}; }

    // 旧版记录只按档位存（"medium"），迁移到当前算法命名空间（"classic:medium"）
    let migrated = false;
    for (const key of Object.keys(bests)) {
      const item = bests[key];
      if (!item || typeof item !== 'object' || typeof item.ms !== 'number') continue;
      if (key.indexOf(':') === -1) {
        bests['classic:' + key] = item;
        delete bests[key];
        migrated = true;
      }
    }
    if (migrated) persistBests();
  }

  function persistBests() {
    try { localStorage.setItem(BESTS_KEY, JSON.stringify(bests)); } catch (_) {}
  }

  /** 记录键：预设档位按「算法:档位」；自定义按「算法:custom:宽x高」 */
  function bestKey(algorithm, level, rows, cols) {
    return level === 'custom'
      ? `${algorithm}:custom:${cols}x${rows}`
      : `${algorithm}:${level}`;
  }

  function bestOf(level, algorithm, rows, cols) {
    return bests[bestKey(
      algorithm || S.algorithm,
      level || S.level,
      rows || S.rows,
      cols || S.cols
    )] || null;
  }

  function recordBest(level, algorithm, rows, cols, ms, moves) {
    const key = bestKey(algorithm, level, rows, cols);
    const cur = bests[key];
    if (cur && cur.ms <= ms) return false;
    bests[key] = { ms, moves, at: Date.now() };
    persistBests();
    return true;
  }

  function updateBestHud() {
    if (!els.bestTime) return;
    const best = bestOf();
    els.bestTime.textContent = best ? formatTime(best.ms) : '—';
  }

  /* ---------------- 计时与状态 ---------------- */
  function startTimer() {
    if (S.running) return;
    S.running = true;
    S.startedAt = Date.now();
    renderTime();
  }

  function stopTimer() {
    if (!S.running) return;
    S.elapsed += Date.now() - S.startedAt;
    S.running = false;
    S.startedAt = 0;
  }

  function elapsedMs() {
    return S.elapsed + (S.running ? Date.now() - S.startedAt : 0);
  }

  function formatTime(ms) {
    const total = ms > 0 ? Math.max(1, Math.floor(ms / 1000)) : 0;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function renderTime() {
    els.time.textContent = formatTime(elapsedMs());
  }

  let timerId = setInterval(() => { if (S.running) renderTime(); }, 500);

  function updateStatus() {
    if (!S.puzzle) return;
    const an = { solved: S.done.length === S.puzzle.islands.length, almost: false };
    an.almost = an.solved && !isConnected();
    let text = '进行中', cls = '';
    if (S.won) { text = '已完成'; cls = 'is-won'; }
    else if (an.almost) { text = '差最后一步'; cls = 'is-almost'; }
    els.status.textContent = text;
    els.statusItem.className = 'hud-item status ' + cls;
    els.moves.textContent = String(S.moves);
    if (els.progress) {
      const pct = Math.round((S.done.length / S.puzzle.islands.length) * 100);
      els.progress.style.width = pct + '%';
      els.progress.style.background = S.won ? 'var(--valid)' : (an.almost ? 'var(--accent)' : 'var(--valid)');
    }
    renderTime();
  }

  function isConnected() {
    return Engine.analyze(S.puzzle, S.bridges).connected;
  }

  function updateUndoRedo() {
    els.undo.disabled = !S.history.length || S.won;
    els.redo.disabled = !S.future.length || S.won;
  }

  /* ---------------- 通关 ---------------- */
  function finish() {
    stopTimer();
    S.won = true;
    S.lastRecord = recordBest(S.level, S.algorithm, S.rows, S.cols, elapsedMs(), S.moves);
    S.selected = -1;
    S.hint = null;
    updateStatus();
    updateUndoRedo();
    syncUI();
    save();
    requestDraw();
    play('win');
    setTimeout(() => showWin(), 420);
  }

  function showWin() {
    els.toast.classList.remove('show');
    const level = LEVEL_META[S.level];
    const best = bestOf(S.level, S.algorithm, S.rows, S.cols);
    const time = formatTime(elapsedMs());
    els.dialog.innerHTML = `
      <p class="eyebrow">Puzzle Complete</p>
      <h2>全部连通了</h2>
      <p class="lede">${level ? level.name + ' · ' + level.cn : ''} 关卡已完成，所有岛屿的数字都恰好满足。</p>
      ${S.lastRecord ? '<p class="record-badge">新纪录 · 该难度最快</p>' : ''}
      <div class="win-stats">
        <div><span>用时</span><b>${time}</b></div>
        <div><span>步数</span><b>${S.moves}</b></div>
        <div><span>最佳</span><b>${best ? formatTime(best.ms) : time}</b></div>
      </div>
      <div class="dialog-actions">
        <button class="btn" data-close="1">看看棋盘</button>
        <button class="btn solid" data-new="1">再来一局</button>
      </div>`;
    els.overlay.classList.add('show');
  }

  function showHelp() {
    els.toast.classList.remove('show');
    els.dialog.innerHTML = `
      <p class="eyebrow">How to play</p>
      <h2>橋をかけろ</h2>
      <p class="lede">把所有岛屿用桥连成一个整体，每座岛上的数字就是它需要的桥的数量。</p>
      <ul class="rules">
        <li><em>1</em><div><b>水平或垂直</b><span>桥只能横平竖直地连接同一行或同一列上的两座岛，中间不能隔着别的岛。</span></div></li>
        <li><em>2</em><div><b>最多两座</b><span>一对岛之间最多可以建两座桥（双桥），不能再多。</span></div></li>
        <li><em>3</em><div><b>不能交叉</b><span>桥之间不允许交叉。</span></div></li>
        <li><em>4</em><div><b>数量刚好</b><span>每座岛连出的桥数要正好等于岛上的数字；超出会变红。</span></div></li>
        <li><em>5</em><div><b>全部连通</b><span>最后所有岛必须能通过桥互相到达，不能有独立的小团体。</span></div></li>
      </ul>
      <div class="tips">
        点一下岛选中，再点同一条线上的另一座岛即可造桥；连续点同一对岛可在 0 → 1 → 2 座之间切换。<br>
        直接从一座岛向另一座岛拖动也能架桥；<b>点一下已建好的桥即可拆除</b>。<br>
        快捷键：<kbd>U</kbd> 撤销 · <kbd>R</kbd> 重开 · <kbd>N</kbd> 新局 · <kbd>H</kbd> 提示 · <kbd>S</kbd> 设置。
      </div>
      <div class="dialog-actions" style="margin-top:18px">
        <button class="btn solid" data-close="1">开始解题</button>
      </div>`;
    els.overlay.classList.add('show');
  }

  function closeOverlay() {
    els.overlay.classList.remove('show');
  }

  els.overlay.addEventListener('click', ev => {
    const t = ev.target;
    if (t.dataset && t.dataset.close) { closeOverlay(); return; }
    if (t.dataset && t.dataset.new) { closeOverlay(); newGame(S.level); return; }
    if (t === els.overlay) closeOverlay();
  });

  /* ---------------- 提示条 ---------------- */
  let toastId = 0;
  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('show');
    const id = ++toastId;
    setTimeout(() => { if (id === toastId) els.toast.classList.remove('show'); }, 2600);
  }

  /* ---------------- 存档 ---------------- */
  function save() {
    if (!S.puzzle) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        algorithm: S.algorithm,
        level: S.level,
        rows: S.rows,
        cols: S.cols,
        seed: S.seed,
        bridges: Array.from(S.bridges),
        moves: S.moves,
        elapsed: elapsedMs(),
        won: S.won,
        theme: S.theme,
        sound: S.soundOn
      }));
    } catch (_) {}
  }

  function restore() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { data = null; }
    if (!data || !data.level || typeof data.seed !== 'number') return false;

    if (data.theme) applyTheme(data.theme);
    if (typeof data.sound === 'boolean') setSound(data.sound);

    const algorithm = data.algorithm === 'apk' ? 'apk' : 'classic';
    let level = data.level || 'medium';
    let rows = data.rows;
    let cols = data.cols;
    if (level !== 'custom') {
      const cfg = Engine.LEVELS[level] || Engine.LEVELS.medium;
      const matches = (r, c) => rows === r && cols === c;
      if (!matches(cfg.rows, cfg.cols) && !matches(cfg.cols, cfg.rows)) {
        const dims = orientedDims(level);
        rows = dims.rows;
        cols = dims.cols;
      }
    }
    if (!Number.isInteger(rows) || !Number.isInteger(cols)) {
      level = 'medium';
      rows = Engine.LEVELS.medium.rows;
      cols = Engine.LEVELS.medium.cols;
    }
    const p = generatePuzzle(algorithm, level, rows, cols, data.seed);
    if (!p) return false;
    S.algorithm = algorithm;
    S.level = level;
    S.rows = rows;
    S.cols = cols;
    setPuzzle(p, data.seed);

    if (Array.isArray(data.bridges) && data.bridges.length === p.edges.length) {
      for (let i = 0; i < p.edges.length; i++) {
        const v = data.bridges[i];
        S.bridges[i] = v === 1 || v === 2 ? v : 0;
      }
      S.moves = data.moves || 0;
      S.elapsed = Math.max(0, data.elapsed || 0);
      refresh();
      updateStatus();
      updateUndoRedo();
      if (S.done.length === p.islands.length) {
        const an = Engine.analyze(p, S.bridges);
        if (an.solved) { S.won = true; updateStatus(); }
      }
      requestDraw();
    }
    return true;
  }

  /* ---------------- 关卡与设置抽屉 ---------------- */
  function buildLevelList() {
    els.levelList.innerHTML = '';
    for (const key of LEVEL_ORDER) {
      const cfg = Engine.LEVELS[key];
      const meta = LEVEL_META[key];
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'level-row';
      row.dataset.level = key;
      row.innerHTML = `
        <span class="name">${meta.name} · ${meta.cn}<span class="warn" data-warn></span></span>
        <span class="meta" data-meta>${cfg.cols}×${cfg.rows}</span>
        <span class="best"><small>最佳</small><b data-best>—</b></span>`;
      row.addEventListener('click', () => {
        closeDrawer();
        if (key === S.level && S.puzzle) return;
        newGame(key);
      });
      els.levelList.appendChild(row);
    }
  }

  /** 统一刷新：顶栏（尺寸+算法）、难度列表高亮/最佳、分段控件、提示文案 */
  function syncUI() {
    if (!S.puzzle) return;
    const lim = ALGORITHMS[S.algorithm];
    els.levelName.textContent = S.level === 'custom' ? '自定义' : (LEVEL_META[S.level] || LEVEL_META.medium).name;
    els.levelMeta.textContent = `${S.cols}×${S.rows} · ${lim.label}`;

    for (const row of els.levelList.children) {
      const key = row.dataset.level;
      row.classList.toggle('is-active', key === S.level);
      const cfg = Engine.LEVELS[key];
      const dims = orientedDims(key);
      const meta = row.querySelector('[data-meta]');
      if (meta) meta.textContent = `${dims.cols}×${dims.rows}`;
      const best = bestOf(key, S.algorithm, dims.rows, dims.cols);
      const slot = row.querySelector('[data-best]');
      if (slot) {
        slot.textContent = best ? formatTime(best.ms) : '—';
        slot.classList.toggle('is-empty', !best);
      }
      const warn = row.querySelector('[data-warn]');
      if (warn) warn.textContent = row.dataset.small === '1' ? '·小屏偏小' : '';
    }

    for (const btn of els.algoGroup.querySelectorAll('.seg')) {
      const on = btn.dataset.algo === S.algorithm;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
    }

    if (els.algoHint) els.algoHint.textContent = lim.hint;
    if (els.sizeHint) {
      const own = bestOf(S.level, S.algorithm, S.rows, S.cols);
      els.sizeHint.textContent =
        `单边 ${lim.min}–${lim.max}、面积 ≤ ${lim.maxArea} · 当前 ${S.cols}×${S.rows}` +
        (S.level === 'custom' ? ` · 最佳 ${own ? formatTime(own.ms) : '—'}` : '') +
        (view.cell && view.cell < MIN_CELL ? ' · 当前屏幕偏小' : '');
    }
    updateBestHud();
  }

  /** 切换生成算法：必要时把超出上限的尺寸收敛，然后重开一局 */
  function selectAlgorithm(key) {
    if (!ALGORITHMS[key] || key === S.algorithm) return;
    const lim = ALGORITHMS[key];
    let rows = S.rows, cols = S.cols, level = S.level, clamped = false;
    if (rows > lim.max) { rows = lim.max; clamped = true; }
    if (cols > lim.max) { cols = lim.max; clamped = true; }
    if (rows < lim.min) { rows = lim.min; clamped = true; }
    if (cols < lim.min) { cols = lim.min; clamped = true; }
    if (clamped) level = 'custom';
    clearSizeError();
    newGame({ algorithm: key, level, rows, cols });
    toast(clamped
      ? `已切换为${lim.label}算法，尺寸调整为 ${cols}×${rows}`
      : `已切换为${lim.label}算法`);
  }

  function validateSize(rows, cols) {
    const lim = ALGORITHMS[S.algorithm];
    if (!Number.isInteger(rows) || !Number.isInteger(cols)) return '宽和高必须是整数';
    if (cols < lim.min) return `宽度不能小于 ${lim.min}（当前 ${cols}）`;
    if (cols > lim.max) return `${lim.label}算法宽度上限 ${lim.max}（当前 ${cols}）`;
    if (rows < lim.min) return `高度不能小于 ${lim.min}（当前 ${rows}）`;
    if (rows > lim.max) return `${lim.label}算法高度上限 ${lim.max}（当前 ${rows}）`;
    if (rows * cols > lim.maxArea) return `${lim.label}算法面积上限 ${lim.maxArea} 格（当前 ${rows * cols}）`;
    return '';
  }

  function showSizeError(msg) {
    if (!els.sizeError) return;
    els.sizeError.textContent = msg;
    els.sizeError.classList.add('show');
  }

  function clearSizeError() {
    if (!els.sizeError) return;
    els.sizeError.textContent = '';
    els.sizeError.classList.remove('show');
  }

  function fillSizeInputs() {
    if (!els.sizeCols || !els.sizeRows) return;
    const lim = ALGORITHMS[S.algorithm];
    for (const input of [els.sizeCols, els.sizeRows]) {
      input.min = lim.min;
      input.max = lim.max;
    }
    els.sizeCols.value = String(S.cols);
    els.sizeRows.value = String(S.rows);
  }

  function applyCustomSize() {
    const cols = parseInt(els.sizeCols.value, 10);
    const rows = parseInt(els.sizeRows.value, 10);
    const err = validateSize(rows, cols);
    if (err) {
      showSizeError(err);
      toast(err);
      play('error');
      return;
    }
    clearSizeError();
    closeDrawer();
    newGame({ level: 'custom', rows, cols });
    toast(`已应用自定义尺寸 ${cols}×${rows}`);
  }

  /** 标出在当前窗口下格子会过小的档位（不隐藏，交给玩家决定） */
  function updateLevelAvailability() {
    if (!els.levelList) return;
    const rect = els.stage.getBoundingClientRect();
    const maxW = Math.max(160, rect.width - 18);
    const maxH = Math.max(160, rect.height - 18);
    for (const row of els.levelList.children) {
      const dims = orientedDims(row.dataset.level);
      const cell = Math.min(maxW / (dims.cols + 0.9), maxH / (dims.rows + 0.9));
      row.dataset.small = cell < MIN_CELL ? '1' : '0';
    }
    if (els.levelHint) {
      els.levelHint.textContent = '棋盘会按窗口自适应；标「小屏偏小」的档位建议横屏或放大窗口。';
    }
    syncUI();
  }

  function openDrawer() {
    updateLevelAvailability();
    fillSizeInputs();
    clearSizeError();
    els.drawer.classList.add('open');
    els.backdrop.classList.add('show');
    els.drawer.setAttribute('aria-hidden', 'false');
    try { els.drawerClose.focus({ preventScroll: true }); } catch (_) {}
  }

  function closeDrawer() {
    els.drawer.classList.remove('open');
    els.backdrop.classList.remove('show');
    els.drawer.setAttribute('aria-hidden', 'true');
  }

  function isDrawerOpen() {
    return els.drawer.classList.contains('open');
  }

  /* ---------------- 全屏 ---------------- */
  function fullscreenSupported() {
    const el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  }

  function fullscreenActive() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function syncFullscreenUI() {
    if (!els.fullscreen) return;
    const on = fullscreenActive();
    els.fullscreen.setAttribute('aria-pressed', on ? 'true' : 'false');
    els.fullscreen.setAttribute('aria-label', on ? '退出全屏' : '进入全屏');
    els.fullscreen.innerHTML = on ? icon.collapse() : icon.expand();
  }

  async function toggleFullscreen() {
    if (!fullscreenSupported()) {
      toast('当前浏览器不支持全屏');
      return;
    }
    try {
      const el = document.documentElement;
      if (!fullscreenActive()) {
        if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
        else el.webkitRequestFullscreen();
      } else if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (_) {
      toast('全屏切换失败');
    }
  }

  // 依据视口挑一个「岛不会小到点不准」的默认尺寸，最大不超过 Medium
  function defaultLevelForViewport() {
    const availW = Math.min(window.innerWidth - 32, 880);
    const availH = window.innerHeight - 210;
    for (const key of ['medium', 'small', 'mini']) {
      const dims = orientedDims(key);
      const cell = Math.min(availW / (dims.cols + 0.9), Math.max(120, availH) / (dims.rows + 0.9));
      if (cell >= 32) return key;
    }
    return 'mini';
  }

  /* ---------------- 事件 ---------------- */
  // 容器尺寸变化（字体加载、工具栏换行、软键盘等）都会触发重排
  if (typeof ResizeObserver !== 'undefined') {
    let roFrame = 0;
    const ro = new ResizeObserver(() => {
      if (roFrame) return;
      roFrame = requestAnimationFrame(() => {
        roFrame = 0;
        layout();
        if (isDrawerOpen()) updateLevelAvailability();
      });
    });
    ro.observe(els.stage);
    ro.observe(document.querySelector('.toolbar'));
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { layout(); if (isDrawerOpen()) updateLevelAvailability(); });
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { layout(); if (isDrawerOpen()) updateLevelAvailability(); }, 120);
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => { layout(); if (isDrawerOpen()) updateLevelAvailability(); }, 260);
  });

  els.undo.addEventListener('click', undo);
  els.redo.addEventListener('click', redo);
  els.hint.addEventListener('click', doHint);
  els.restart.addEventListener('click', restart);
  els.fresh.addEventListener('click', () => newGame(S.level));

  if (els.fullscreen) {
    if (!fullscreenSupported()) {
      els.fullscreen.style.display = 'none';
    } else {
      els.fullscreen.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', syncFullscreenUI);
      document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
      syncFullscreenUI();
    }
  }

  els.settings.addEventListener('click', openDrawer);
  els.levelBtn.addEventListener('click', openDrawer);
  els.drawerClose.addEventListener('click', closeDrawer);
  els.backdrop.addEventListener('click', closeDrawer);

  els.optSound.addEventListener('change', () => {
    setSound(els.optSound.checked);
    if (S.soundOn) play('place');
    save();
  });

  els.optTheme.addEventListener('change', () => {
    applyTheme(els.optTheme.checked ? 'dark' : 'light');
    save();
  });

  els.help.addEventListener('click', () => { closeDrawer(); showHelp(); });

  els.algoGroup.addEventListener('click', ev => {
    const btn = ev.target.closest('.seg');
    if (!btn) return;
    selectAlgorithm(btn.dataset.algo);
  });

  els.applySize.addEventListener('click', applyCustomSize);
  for (const input of [els.sizeCols, els.sizeRows]) {
    input.addEventListener('input', clearSizeError);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); applyCustomSize(); }
    });
  }

  let clearArmed = false;
  els.clearBests.addEventListener('click', () => {
    if (!clearArmed) {
      clearArmed = true;
      els.clearBests.classList.add('danger');
      els.clearBests.textContent = '再点一次确认清空';
      setTimeout(() => {
        if (!clearArmed) return;
        clearArmed = false;
        els.clearBests.classList.remove('danger');
        els.clearBests.textContent = '清空最佳成绩';
      }, 3200);
      return;
    }
    clearArmed = false;
    bests = {};
    persistBests();
    els.clearBests.classList.remove('danger');
    els.clearBests.textContent = '清空最佳成绩';
    syncUI();
    toast('最佳成绩已清空');
  });

  function setSound(on) {
    S.soundOn = on;
    if (els.optSound) els.optSound.checked = on;
  }

  window.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey) {
      if (ev.key.toLowerCase() === 'z') {
        ev.preventDefault();
        ev.shiftKey ? redo() : undo();
      }
      return;
    }
    const k = ev.key.toLowerCase();
    if (k === 'escape') {
      if (isDrawerOpen()) { closeDrawer(); return; }
      closeOverlay();
      S.selected = -1;
      requestDraw();
    } else if (k === 's') {
      if (isDrawerOpen()) closeDrawer(); else openDrawer();
    } else if (k === 'f') toggleFullscreen();
    else if (k === 'u') undo();
    else if (k === 'r') restart();
    else if (k === 'n') newGame(S.level);
    else if (k === 'h') doHint();
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  /* ---------------- 启动 ---------------- */
  els.settings.innerHTML = icon.gear();
  if (els.version) els.version.textContent = 'v' + VERSION;
  readPalette();
  loadBests();
  buildLevelList();
  setSound(true);

  if (!restore()) {
    newGame(defaultLevelForViewport());
  }
  syncUI();
  setTimeout(() => { layout(); syncUI(); }, 60);

  // 首次进入展示玩法说明（仅一次）
  try {
    if (!localStorage.getItem(STORE_KEY + '.seen')) {
      setTimeout(showHelp, 420);
      localStorage.setItem(STORE_KEY + '.seen', '1');
    }
  } catch (_) {}

  setInterval(() => { if (S.hint && performance.now() > S.hint.until) { S.hint = null; requestDraw(); } }, 500);

  // 调试/自动化入口，仅 #debug 时暴露
  if (location.hash === '#debug') {
    window.__hashi = {
      S, view, Engine,
      setBridge, cycleEdge, edgeBetween, bridgeAt, newGame, undo, redo, restart, doHint,
      centerOf, redraw: requestDraw, layout, openDrawer, closeDrawer,
      bests: () => bests, ALGORITHMS, generatePuzzle, selectAlgorithm, applyCustomSize,
      solve() {
        for (let i = 0; i < S.solution.length; i++) {
          if (S.bridges[i] !== S.solution[i]) setBridge(i, S.solution[i], true);
        }
      }
    };
  }
})();

</script>
</body>
</html>
